# Render Blueprint for the LinkHub API on the free plan.
# The web app is deployed separately on Vercel (root directory: apps/web).
#
# Free instances sleep after 15 minutes of inactivity and cold-start in
# ~30-60 seconds. Keep the API warm with a 5-minute uptime monitor, or upgrade
# the service to a paid always-on instance.
#
# Free instances do not support preDeployCommand or cron jobs:
# - Migrations run in buildCommand (`pnpm db:deploy`) before `pnpm api:build`,
#   so the new API never starts before its columns exist. Keep migrations
#   backward-compatible (expand/contract): the old API may still serve traffic
#   while the build runs.
# - The nightly analytics job runs from
#   .github/workflows/analytics-nightly.yml.
#
# Secrets marked `sync: false` are prompted for when the Blueprint is created.
# Generate five distinct values with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
# The same REVALIDATE_SECRET, INTERNAL_FETCH_TOKEN and WEB_PROXY_SECRET values
# must be configured in the Vercel project.

envVarGroups:
  - name: linkhub-api-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: INTERNAL_FETCH_TOKEN
        sync: false
      - key: WEB_PROXY_SECRET
        sync: false
      - key: ANALYTICS_HASH_SECRET
        sync: false

services:
  - type: web
    name: linkhub-api
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:deploy && pnpm api:build
    startCommand: pnpm api:start
    healthCheckPath: /api/v1/health/live
    autoDeployTrigger: commit
    # Documentation, the web app and CI config do not affect the API bundle.
    # Ignoring them avoids a rebuild and restart (and a rate-limit reset) on
    # every docs commit. API, shared, prisma and lockfile changes still deploy.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - apps/web/**
        - .github/**
    envVars:
      - fromGroup: linkhub-api-shared
      - key: APP_URL
        value: https://link.nayankunwar.com
      - key: WEB_INTERNAL_URL
        value: https://link.nayankunwar.com
      - key: TRUST_PROXY
        value: "3"
      - key: DEFAULT_USERNAME
        value: nayankunwar
      - key: ROOT_MODE
        value: profile
      - key: ALLOW_SIGNUP
        value: "false"
      # Optional. Leave empty to keep Google sign-in disabled. When set, use the
      # same Web OAuth client ID as NEXT_PUBLIC_GOOGLE_CLIENT_ID on Vercel.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ACCOUNT_DELETION_GRACE_DAYS
        value: "30"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_FROM
        value: "Link Hub <no-reply@nayankunwar.com>"
      - key: EMAIL_BREVO_API_KEY
        sync: false
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      - key: CLICK_DEDUPE_SECONDS
        value: "30"
      # Server-owned link previews. Set METADATA_FETCH_ENABLED=false to stop
      # all outbound OG/Twitter fetches without affecting saved links.
      - key: METADATA_FETCH_ENABLED
        value: "true"
      - key: METADATA_SKIP_HOSTS
        value: "instagram.com,instagr.am,amazon.com,amazon.in,amzn.to,amzn.in,a.co"
      - key: LOG_LEVEL
        value: info
