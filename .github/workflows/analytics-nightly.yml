name: Nightly analytics

on:
  # Primary trigger: a free cron-job.org job dispatches this workflow daily at
  # 03:17 UTC. GitHub's schedule trigger is best-effort and silently dropped the
  # 2026-10-27 03:00 UTC run, so it is intentionally not used. See DEPLOYMENT.md.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: analytics-nightly
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Run nightly rollup and prune
        run: pnpm job:analytics
        env:
          NODE_ENV: production
          # The job only needs the direct database connection. Do not expose
          # signing, proxy, or analytics secrets to a scheduled workflow.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Success-only dead-man's switch. If the job fails, this step is skipped
      # and Healthchecks alerts in addition to the GitHub issue below. A failed
      # ping must not mark an otherwise successful job as failed; the missing
      # ping is itself the alert.
      - name: Ping heartbeat
        if: success()
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          curl -fsS -m 10 --retry 3 -o /dev/null \
            --data "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$HEARTBEAT_URL"

      - name: Open or update a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "nightly-failure";
            const title = "Nightly analytics job is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly analytics job failed.",
              "",
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Time: ${new Date().toISOString()}`,
              "",
              "Check the job logs and the Render service logs. The job is safe to rerun; it uses an advisory lock and idempotent rollups.",
            ].join("\n");

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "d73a4a",
                description: "Automated alert from the nightly analytics workflow",
              });
            }

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
